name: Build Android App (APK & AAB for Play Store)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & Play Store Bundle (.aab)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Sync Capacitor Android
        run: npx --yes @capacitor/cli sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Check Gradle
        working-directory: android
        run: ./gradlew --version

      - name: Build Android App Bundle
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: KhamarPro-Release-AAB-PlayStore
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
