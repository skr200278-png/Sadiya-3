name: Build Android App (APK & AAB for Play Store)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & Play Store Bundle (.aab)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Sync Capacitor Android
        run: npx --yes @capacitor/cli sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Check Gradle
        working-directory: android
        run: ./gradlew --version

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Release keystore secret is missing or empty."
            exit 1
          fi

          echo "Decoding release keystore..."

          # Remove whitespace/newlines that may have been introduced
          # when the Base64 value was copied into GitHub Secrets.
          CLEAN_BASE64="$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')"

          # Validate Base64 before writing the keystore.
          printf '%s' "$CLEAN_BASE64" | base64 --decode >/tmp/release.keystore

          # Confirm that the decoded file is a valid Java keystore.
          keytool -list -keystore /tmp/release.keystore \
            -storepass "$RELEASE_STORE_PASSWORD" >/dev/null

          mkdir -p android/app
          cp /tmp/release.keystore android/app/release.keystore

          echo "Release keystore decoded and validated successfully."
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || secrets.RELEASE_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}

      - name: Build Android App Bundle & APK
        working-directory: android
        env:
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || secrets.RELEASE_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --stacktrace

      - name: Verify Signed Release APK
        run: |
          SIGNED_APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ -f "$SIGNED_APK" ]; then
            echo "Signed Release APK found. Verifying signature..."

            if [ -x "${ANDROID_HOME}/build-tools/35.0.0/apksigner" ]; then
              "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SIGNED_APK"
            else
              apksigner verify --verbose --print-certs "$SIGNED_APK"
            fi

            echo "APK signature verification successful!"
          else
            echo "ERROR: Signed Release APK not found!"
            ls -la android/app/build/outputs/apk/release/ || true
            exit 1
          fi

      - name: Verify Signed Release AAB
        run: |
          SIGNED_AAB="android/app/build/outputs/bundle/release/app-release.aab"

          if [ -f "$SIGNED_AAB" ]; then
            echo "Release AAB found successfully."
          else
            echo "ERROR: Release AAB not found!"
            exit 1
          fi

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: KhamarPro-Release-AAB-PlayStore
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: KhamarPro-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
