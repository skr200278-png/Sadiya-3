name: Build Android App (APK & AAB for Play Store)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & Play Store Bundle (.aab)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android App Bundle (Play Store .aab) & APK
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease assembleDebug --stacktrace

      - name: Upload Play Store AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KhamarPro-Release-AAB-PlayStore
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Upload APKs (Release & Debug) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KhamarPro-APKs
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
