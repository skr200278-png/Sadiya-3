<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Card Linear Gradient (Pristine White) -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- Outer Emerald Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="50%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#0f5132"/>
    </linearGradient>

    <!-- Sun & Horizon Glow Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- Lush Field Gradient -->
    <linearGradient id="fieldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="fieldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>

    <!-- Barn Red Gradient -->
    <linearGradient id="barnRoofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Golden Wheat Gradient -->
    <linearGradient id="goldWheat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Multi-stage Drop Shadows for depth -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#052e16" flood-opacity="0.30"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12"/>
    </filter>

    <filter id="elementShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 1. Master Pristine White Badge -->
  <g filter="url(#badgeShadow)">
    <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#rimGrad)"/>
    <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#cardGrad)"/>
    <rect x="32" y="32" width="448" height="448" rx="104" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  </g>

  <!-- 2. Farmland Scenery -->
  <g>
    <!-- Golden Sun in Background -->
    <circle cx="256" cy="180" r="90" fill="#fef9c3" opacity="0.6"/>
    <circle cx="256" cy="180" r="70" fill="url(#sunGrad)" opacity="0.4"/>
    <circle cx="256" cy="180" r="50" fill="url(#sunGrad)"/>

    <!-- Rolling Green Farmland Hills -->
    <path d="M48 300 Q 140 240 256 260 Q 370 280 464 240 L 464 424 Q 362 444 256 440 Q 150 436 48 424 Z" fill="url(#fieldGrad1)"/>
    <path d="M48 335 Q 160 295 280 315 Q 390 335 464 310 L 464 428 Q 362 444 256 440 Q 150 436 48 428 Z" fill="url(#fieldGrad2)"/>

    <!-- Left: Traditional Red Barn & Silo -->
    <g filter="url(#elementShadow)" transform="translate(62, 175) scale(0.55)">
      <!-- Silo -->
      <path d="M20 50 Q35 20 50 50 Z" fill="#94a3b8"/>
      <rect x="20" y="50" width="30" height="110" rx="3" fill="#e2e8f0"/>
      <line x1="20" y1="75" x2="50" y2="75" stroke="#cbd5e1" stroke-width="2"/>
      <line x1="20" y1="105" x2="50" y2="105" stroke="#cbd5e1" stroke-width="2"/>
      <!-- Barn Body -->
      <rect x="45" y="65" width="130" height="95" rx="4" fill="#ef4444"/>
      <polygon points="110,15 40,68 180,68" fill="url(#barnRoofGrad)"/>
      <rect x="85" y="95" width="50" height="65" rx="3" fill="#ffffff"/>
      <line x1="87" y1="97" x2="133" y2="158" stroke="#ef4444" stroke-width="3"/>
      <line x1="133" y1="97" x2="87" y2="158" stroke="#ef4444" stroke-width="3"/>
    </g>

    <!-- CENTER-LEFT: Dairy Cow (গরু) -->
    <g filter="url(#elementShadow)" transform="translate(130, 155) scale(0.95)">
      <!-- Horns -->
      <path d="M35 65 Q 15 35 5 30 Q 15 50 30 75 Z" fill="#f59e0b"/>
      <path d="M115 65 Q 135 35 145 30 Q 135 50 120 75 Z" fill="#f59e0b"/>
      <!-- Ears -->
      <path d="M30 75 Q 0 80 8 100 Q 25 95 40 87 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <path d="M20 82 Q 8 85 15 95 Q 26 91 30 87 Z" fill="#fca5a5"/>
      <path d="M120 75 Q 150 80 142 100 Q 125 95 110 87 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <path d="M130 82 Q 142 85 135 95 Q 124 91 120 87 Z" fill="#fca5a5"/>
      <!-- Head Base -->
      <path d="M30 70 Q 75 55 120 70 Q 135 110 125 155 Q 75 175 25 155 Q 15 110 30 70 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
      <!-- Spots -->
      <path d="M55 60 Q 75 55 95 61 Q 90 90 75 85 Q 60 90 55 60 Z" fill="#1e293b"/>
      <path d="M105 95 Q 130 105 123 140 Q 105 130 105 95 Z" fill="#1e293b"/>
      <!-- Eyes -->
      <ellipse cx="48" cy="106" rx="6.5" ry="8.5" fill="#0f172a"/>
      <circle cx="46" cy="103" r="2.2" fill="#ffffff"/>
      <ellipse cx="102" cy="106" rx="6.5" ry="8.5" fill="#0f172a"/>
      <circle cx="100" cy="103" r="2.2" fill="#ffffff"/>
      <!-- Snout -->
      <ellipse cx="75" cy="158" rx="38" ry="25" fill="#fed7aa" stroke="#fbd5b5" stroke-width="2"/>
      <ellipse cx="60" cy="158" rx="4.5" ry="6" fill="#78350f" transform="rotate(-15 60 158)"/>
      <ellipse cx="90" cy="158" rx="4.5" ry="6" fill="#78350f" transform="rotate(15 90 158)"/>
      <path d="M66 170 Q 75 177 84 170" stroke="#78350f" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <!-- Bell -->
      <circle cx="75" cy="195" r="7" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>
    </g>

    <!-- CENTER-RIGHT: Cute Farm Goat (ছাগল / ব্ল্যাক বেঙ্গল ও যমুনাপারি ছাগল) -->
    <g filter="url(#elementShadow)" transform="translate(290, 195) scale(0.9)">
      <!-- Goat Curved Horns -->
      <path d="M42 55 Q 30 15 15 5 Q 32 18 48 50 Z" fill="#78350f"/>
      <path d="M78 55 Q 90 15 105 5 Q 88 18 72 50 Z" fill="#78350f"/>
      <!-- Long Drooping Ears (ছাগলের মিষ্টি কান) -->
      <path d="M38 68 Q 10 75 5 110 Q 22 115 42 82 Z" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
      <path d="M20 85 Q 12 92 14 105 Q 24 105 30 88 Z" fill="#fca5a5"/>
      <path d="M82 68 Q 110 75 115 110 Q 98 115 78 82 Z" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
      <path d="M100 85 Q 108 92 106 105 Q 96 105 90 88 Z" fill="#fca5a5"/>
      <!-- Goat Face Base -->
      <path d="M38 62 Q 60 52 82 62 Q 95 100 80 145 Q 60 160 40 145 Q 25 100 38 62 Z" fill="#ffedd5" stroke="#fed7aa" stroke-width="2.5"/>
      <!-- Goat Forehead Patch / Marking -->
      <path d="M50 58 Q 60 55 70 58 Q 66 85 60 85 Q 54 85 50 58 Z" fill="#9a3412"/>
      <!-- Goat Eyes -->
      <ellipse cx="46" cy="92" rx="5.5" ry="7" fill="#451a03"/>
      <circle cx="44" cy="90" r="1.8" fill="#ffffff"/>
      <ellipse cx="74" cy="92" rx="5.5" ry="7" fill="#451a03"/>
      <circle cx="72" cy="90" r="1.8" fill="#ffffff"/>
      <!-- Goat Nose & Mouth -->
      <ellipse cx="60" cy="138" rx="16" ry="12" fill="#fed7aa"/>
      <ellipse cx="54" cy="137" rx="2.5" ry="3.5" fill="#78350f"/>
      <ellipse cx="66" cy="137" rx="2.5" ry="3.5" fill="#78350f"/>
      <path d="M55 145 Q 60 149 65 145" stroke="#78350f" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- Little Goat Beard (ছাগলের দাড়ি) -->
      <path d="M57 150 Q 60 168 55 174 Q 65 170 63 150 Z" fill="#fed7aa"/>
    </g>

    <!-- Golden Wheat Framing Left & Right -->
    <g filter="url(#elementShadow)">
      <g transform="translate(68, 305) rotate(-18)">
        <path d="M20 100 Q 24 50 30 5" stroke="#d97706" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <ellipse cx="18" cy="25" rx="6" ry="11" transform="rotate(-32 18 25)" fill="url(#goldWheat)"/>
        <ellipse cx="38" cy="25" rx="6" ry="11" transform="rotate(32 38 25)" fill="url(#goldWheat)"/>
        <ellipse cx="20" cy="48" rx="6" ry="11" transform="rotate(-32 20 48)" fill="url(#goldWheat)"/>
        <ellipse cx="38" cy="48" rx="6" ry="11" transform="rotate(32 38 48)" fill="url(#goldWheat)"/>
        <ellipse cx="22" cy="72" rx="6" ry="11" transform="rotate(-32 22 72)" fill="url(#goldWheat)"/>
        <ellipse cx="38" cy="72" rx="6" ry="11" transform="rotate(32 38 72)" fill="url(#goldWheat)"/>
        <ellipse cx="30" cy="8" rx="6" ry="11" fill="url(#goldWheat)"/>
      </g>
      <g transform="translate(400, 295) rotate(18)">
        <path d="M20 100 Q 16 50 10 5" stroke="#d97706" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <ellipse cx="8" cy="25" rx="6" ry="11" transform="rotate(-32 8 25)" fill="url(#goldWheat)"/>
        <ellipse cx="28" cy="25" rx="6" ry="11" transform="rotate(32 28 25)" fill="url(#goldWheat)"/>
        <ellipse cx="8" cy="48" rx="6" ry="11" transform="rotate(-32 8 48)" fill="url(#goldWheat)"/>
        <ellipse cx="26" cy="48" rx="6" ry="11" transform="rotate(32 26 48)" fill="url(#goldWheat)"/>
        <ellipse cx="10" cy="72" rx="6" ry="11" transform="rotate(-32 10 72)" fill="url(#goldWheat)"/>
        <ellipse cx="26" cy="72" rx="6" ry="11" transform="rotate(32 26 72)" fill="url(#goldWheat)"/>
        <ellipse cx="10" cy="8" rx="6" ry="11" fill="url(#goldWheat)"/>
      </g>
    </g>

    <!-- Bottom Ribbon: "ডিজিটাল খামার" -->
    <g transform="translate(136, 400)">
      <rect x="0" y="0" width="240" height="42" rx="21" fill="url(#rimGrad)" filter="url(#elementShadow)"/>
      <rect x="2" y="2" width="236" height="38" rx="19" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
      <text x="120" y="26" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="900" text-anchor="middle" letter-spacing="1">ডিজিটাল খামার</text>
    </g>
  </g>
</svg>
